sonar.projectKey=productos-api
sonar.projectName=Productos API (Practica 2 Dev-QA)
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.sourceEncoding=UTF-8

# Cobertura generada por Jest (equivalente a JaCoCo en Node.js)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js,src/docs/**
sonar.exclusions=node_modules/**,coverage/**
